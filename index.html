<body>
<div class="wrap">

<script>/*!
 * 325 运算最简表示 —— 求解核心
 * 块：3、2、5 各用一次、顺序不变、四则运算 + 括号；块之间也用四则运算连接，
 * 每个块只用一次。返回最少块数与表达式。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.S325 = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var PREC = { '+': 1, '-': 1, '*': 2, '/': 2 };
  var SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  var OPS = ['+', '-', '*', '/'];
  var MAX_N = 100000000;

  /* ---------------- 有理数 [n, d] ---------------- */
  function gcd(a, b) {
    a = a < 0 ? -a : a; b = b < 0 ? -b : b;
    while (b) { var t = a % b; a = b; b = t; }
    return a;
  }
  function norm(n, d) {
    if (d < 0) { n = -n; d = -d; }
    if (n === 0) return [0, 1];
    if (d === 1) return [n, 1];
    var g = gcd(n, d);
    if (g > 1) { n /= g; d /= g; }
    return [n, d];
  }
  function kOf(v) { return v[0] + '/' + v[1]; }
  function addV(a, b) {
    return (a[1] === 1 && b[1] === 1) ? [a[0] + b[0], 1] : norm(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
  }
  function subV(a, b) {
    return (a[1] === 1 && b[1] === 1) ? [a[0] - b[0], 1] : norm(a[0] * b[1] - b[0] * a[1], a[1] * b[1]);
  }
  function mulV(a, b) {
    return (a[1] === 1 && b[1] === 1) ? [a[0] * b[0], 1] : norm(a[0] * b[0], a[1] * b[1]);
  }
  function divV(a, b) {
    if (b[0] === 0) return null;
    return (a[1] === 1 && b[1] === 1 && a[0] % b[0] === 0) ? [a[0] / b[0], 1] : norm(a[0] * b[1], a[1] * b[0]);
  }

  /* ---------------- 片段 {text, html, prec} ---------------- */
  function wrap(s, need) { return need ? '(' + s + ')' : s; }
  function mk(op, L, R) {
    var lp = L.prec < PREC[op];
    var rp = R.prec < PREC[op] || (R.prec === PREC[op] && (op === '-' || op === '/'));
    return {
      text: wrap(L.text, lp) + SYM[op] + wrap(R.text, rp),
      html: wrap(L.html, lp) + SYM[op] + wrap(R.html, rp),
      prec: PREC[op]
    };
  }

  /* ---------------- 枚举单块 ---------------- */
  function atom(ch) { return { text: ch, html: ch, val: [Number(ch), 1], prec: 3 }; }
  function opNode(op, l, r) {
    var v;
    if (op === '+') v = addV(l.val, r.val);
    else if (op === '-') v = subV(l.val, r.val);
    else if (op === '*') v = mulV(l.val, r.val);
    else v = divV(l.val, r.val);
    if (!v) return null;
    return { op: op, l: l, r: r, val: v, prec: PREC[op] };
  }
  function closing(s, i) {
    var d = 0;
    for (var j = i; j < s.length; j++) {
      if (s[j] === '(') d++;
      else if (s[j] === ')') { d--; if (!d) return j; }
    }
    return -1;
  }
  function renderTree(n) {
    if (!n.op) return n.text;
    var s = renderTree(n.l);
    if (n.l.prec < n.prec) s = '(' + s + ')';
    var u = renderTree(n.r);
    if (n.r.prec < n.prec || (n.r.prec === n.prec && (n.op === '-' || n.op === '/'))) u = '(' + u + ')';
    return s + SYM[n.op] + u;
  }
  function blockOf(tree) {
    var inner = renderTree(tree);
    var text = (inner.charAt(0) === '(' && closing(inner, 0) === inner.length - 1) ? inner : '(' + inner + ')';
    return {
      n: tree.val[0], d: tree.val[1],
      text: text, html: '<b class="blk">' + text + '</b>', prec: 3
    };
  }

  /* ---------------- 预计算层 ---------------- */
  var LAYERS = null;
  function layers() {
    if (LAYERS) return LAYERS;
    var V = [null, new Map(), new Map(), new Map()];
    var i, j, t;
    for (i = 0; i < OPS.length; i++) {
      for (j = 0; j < OPS.length; j++) {
        var t1 = opNode(OPS[i], atom('3'), atom('2'));
        if (t1) {
          t = opNode(OPS[j], t1, atom('5'));
          if (t) { var b1 = blockOf(t); if (!V[1].has(kOf([b1.n, b1.d]))) V[1].set(kOf([b1.n, b1.d]), b1); }
        }
        var t2 = opNode(OPS[j], atom('2'), atom('5'));
        if (t2) {
          t = opNode(OPS[i], atom('3'), t2);
          if (t) { var b2 = blockOf(t); if (!V[1].has(kOf([b2.n, b2.d]))) V[1].set(kOf([b2.n, b2.d]), b2); }
        }
      }
    }
    function fill(dst, A, B) {
      A.forEach(function (x) {
        B.forEach(function (y) {
          var av = [x.n, x.d], bv = [y.n, y.d];
          for (var o = 0; o < 4; o++) {
            var op = OPS[o], v;
            if (op === '+') v = addV(av, bv);
            else if (op === '-') v = subV(av, bv);
            else if (op === '*') v = mulV(av, bv);
            else v = divV(av, bv);
            if (!v) continue;
            var kk = kOf(v);
            if (dst.has(kk)) continue;
            var p = mk(op, x, y);
            dst.set(kk, { n: v[0], d: v[1], text: p.text, html: p.html, prec: p.prec });
          }
        });
      });
    }
    fill(V[2], V[1], V[1]);
    fill(V[3], V[1], V[2]);
    fill(V[3], V[2], V[1]);
    LAYERS = V;
    return V;
  }

  /* ---------------- 精确搜索 ---------------- */
  var FINDER = null;
  function finder() {
    if (FINDER) return FINDER;
    var V = layers(), memo = new Map();

    function find(v, k) {
      if (k <= 3) {
        var e = V[k].get(kOf(v));
        return e ? { text: e.text, html: e.html, prec: e.prec } : null;
      }
      var key = kOf(v) + '#' + k;
      if (memo.has(key)) return memo.get(key);
      var res = null;
      var order = [];
      for (var oi = 1; oi < k; oi++) order.push(oi);
      order.sort(function (a, b) {
        function est(i) {
          var j = k - i;
          return V[Math.min(i, 3)].size * (j > 3 ? 3000 : 1);
        }
        return est(a) - est(b);
      });

      for (var oi2 = 0; oi2 < order.length && !res; oi2++) {
        var i = order[oi2], j = k - i;
        if (i <= 3) {
          V[i].forEach(function (x) {
            if (res) return;
            var xv = [x.n, x.d];
            var cands = [
              ['+', subV(v, xv)],
              ['-', subV(xv, v)],
              ['*', xv[0] === 0 ? null : divV(v, xv)],
              ['/', (v[0] === 0 || xv[0] === 0) ? null : divV(xv, v)]
            ];
            for (var p = 0; p < 4 && !res; p++) {
              if (!cands[p][1]) continue;
              var t = find(cands[p][1], j);
              if (t) res = mk(cands[p][0], x, t);
            }
          });
        } else {
          V[j].forEach(function (y) {
            if (res) return;
            var yv = [y.n, y.d];
            var cands = [
              ['+', subV(v, yv)],
              ['-', addV(v, yv)],
              ['*', yv[0] === 0 ? null : divV(v, yv)],
              ['/', yv[0] === 0 ? null : mulV(v, yv)]
            ];
            for (var p = 0; p < 4 && !res; p++) {
              if (!cands[p][1]) continue;
              var t = find(cands[p][1], i);
              if (t) res = mk(cands[p][0], t, y);
            }
          });
        }
      }
      memo.set(key, res);
      return res;
    }
    FINDER = find;
    return find;
  }

  /* ---------------- 构造兜底 ---------------- */
  function construct(n) {
    var V = layers(), memo = new Map(), calls = 0;
    var QS = [30, 25, 21, 13, 11, 10, 6, 5];
    function small(m) {
      for (var k = 1; k <= 3; k++) {
        var e = V[k].get(m + '/1');
        if (e) return { k: k, p: { text: e.text, html: e.html, prec: e.prec } };
      }
      return null;
    }
    function horner(m) {
      var ds = [], t = m;
      while (t > 0) { ds.push(t % 30); t = Math.floor(t / 30); }
      ds.reverse();
      var r0 = small(ds[0]), out = { k: r0.k, p: r0.p };
      for (var i = 1; i < ds.length; i++) {
        out = { k: out.k + 1, p: mk('*', out.p, V[1].get('30/1')) };
        var dk = small(ds[i]);
        out = { k: out.k + dk.k, p: mk('+', out.p, dk.p) };
      }
      return out;
    }
    function build(m, depth) {
      if (memo.has(m)) return memo.get(m);
      if (++calls > 6000) return horner(m);
      var best = small(m);
      if (!best && depth < 24 && m > 2) {
        best = horner(m);
        for (var qi = 0; qi < QS.length; qi++) {
          var q = QS[qi];
          if (m < q) continue;
          var r = m % q, a = (m - r) / q;
          if (!a) continue;
          var sub = build(a, depth + 1);
          if (!sub) continue;
          var k = sub.k + 1, p = mk('*', sub.p, V[1].get(q + '/1'));
          if (r > 0) {
            var dr = small(r);
            if (!dr) continue;
            k += dr.k; p = mk('+', p, dr.p);
          }
          if (k < best.k) best = { k: k, p: p };
        }
      }
      memo.set(m, best);
      return best;
    }
    return build(n, 0);
  }

  /* ---------------- 对外 ---------------- */
  var cache = new Map();

  // kmax：穷举到几块；proven 的判据：命中 or 构造块数 ≤ kmax+1
  function solve(nRaw, kmax) {
    var n = Math.floor(Number(nRaw));
    if (!isFinite(n) || n < 1) return { ok: false, msg: '请输入 1 以上的正整数' };
    if (n > 1000000000) return { ok: false, msg: '最多支持 10 亿' };
    kmax = Math.min(kmax || 4, 5);
    var ck = n + '#' + kmax;
    if (cache.has(ck)) return cache.get(ck);

    var out = null, proven = false;
    if (n <= MAX_N) {
      var find = finder();
      for (var k = 1; k <= kmax && !out; k++) {
        var r = find([n, 1], k);
        if (r) { out = { k: k, text: r.text, html: r.html }; proven = true; }
      }
    }
    if (!out) {
      var c = construct(n);
      out = { k: c.k, text: c.p.text, html: c.p.html };
      proven = (n <= MAX_N && c.k <= kmax + 1);
    }
    var res = { ok: true, n: n, k: out.k, text: out.text, html: out.html, proven: proven, kmax: kmax };
    cache.set(ck, res);
    return res;
  }

  return { solve: solve, layers: layers, MAX_N: MAX_N };
});
</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cur = null, busy = false;

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show';
    setTimeout(function () { t.className = 'toast'; }, 1600);
  }

  function render(res) {
    cur = res;
    $('res').className = 'card';
    $('knum').textContent = res.k;
    var unit = $('kunit');
    if (res.proven) { unit.className = 'ok'; unit.textContent = '次（已证明最少）'; }
    else { unit.className = 'no'; unit.textContent = '次（可能还能更少）'; }
    $('target').textContent = res.n;
    $('expr').innerHTML = res.html;
    $('verify').style.display = (!res.proven && res.k <= 6) ? 'block' : 'none';
    $('hint').textContent = res.proven
      ? '已穷举所有不超过 ' + (res.k - 1) + ' 块的式子，确认无法更少。'
      : '这是构造出来的表示；是否最简尚未证明。';
  }

  function run(n, deep) {
    var res = S325.solve(n, deep ? 5 : 4);
    if (!res.ok) { toast(res.msg); return; }
    render(res);
  }

  $('go').onclick = function () {
    var v = $('num').value.replace(/[^\d]/g, '');
    if (!v) { toast('先输入一个正整数'); return; }
    run(v, false);
  };
  $('num').onkeydown = function (e) { if (e.key === 'Enter' || e.keyCode === 13) $('go').onclick(); };
  $('rand').onclick = function () {
    var n = 1 + Math.floor(Math.random() * 99998);
    $('num').value = n;
    run(n, false);
  };
  $('verify').onclick = function () {
    if (!cur || busy) return;
    busy = true;
    var b = $('verify');
    b.textContent = '计算中…';
    setTimeout(function () {
      run(cur.n, true);
      b.textContent = '再严格验证一下';
      busy = false;
    }, 40);
  };

  function shareText(res) {
    var base = location.href.split('?')[0].split('#')[0];
    var url = base + '?n=' + res.n;
    return '【325 挑战】' + res.n + ' 最少要 ' + res.k + ' 次：\n' + res.text +
      '\n规则：3、2、5 各用一次、顺序不变、四则运算+括号算一次。\n你能用更少吗？→ ' + url;
  }

  $('copy').onclick = function () {
    if (!cur) return;
    var txt = shareText(cur);
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制，去群里粘贴吧'); }
      catch (e) { toast('复制失败，请长按表达式手动复制'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast('已复制，去群里粘贴吧'); }, fallback);
    } else fallback();
  };

  function wrapLines(g, text, maxW) {
    var out = [], line = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (g.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; }
      else line += ch;
    }
    if (line) out.push(line);
    return out;
  }

  function makePic(res) {
    var W = 750, H = 1020;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');
    var grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a2552'); grad.addColorStop(1, '#0b1020');
    g.fillStyle = grad; g.fillRect(0, 0, W, H);

    g.fillStyle = '#5be0c1'; g.font = 'bold 30px sans-serif';
    g.fillText('325 运算挑战', 56, 96);
    g.fillStyle = '#6f7aa6'; g.font = '24px sans-serif';
    g.fillText('3、2、5 各用一次 · 顺序不变 · 四则运算', 56, 140);

    g.fillStyle = '#ffd166'; g.font = 'bold 150px sans-serif';
    g.fillText(String(res.n), 52, 320);

    g.fillStyle = '#e9edff'; g.font = 'bold 52px sans-serif';
    g.fillText('最少 ' + res.k + ' 次', 56, 410);
    if (!res.proven) {
      g.fillStyle = '#ff9f6b'; g.font = '26px sans-serif';
      g.fillText('（构造结果，未证明最优）', 56, 452);
    }

    g.fillStyle = '#243262'; g.fillRect(56, 500, W - 112, 3);
    g.fillStyle = '#4be0c1'; g.font = '34px ui-monospace,Menlo,monospace';
    var lines = wrapLines(g, res.text, W - 112);
    var y = 566;
    for (var i = 0; i < lines.length && i < 8; i++) { g.fillText(lines[i], 56, y); y += 50; }

    g.fillStyle = '#6f7aa6'; g.font = '24px sans-serif';
    g.fillText('块之间可继续四则运算，每块只用一次', 56, H - 120);
    g.fillStyle = '#4a5480'; g.font = '22px sans-serif';
    g.fillText(location.host || '325 运算', 56, H - 60);
    return c.toDataURL('image/png');
  }

  function closeMask() {
    $('mask').className = 'mask';
  }

  $('pic').onclick = function () {
    if (!cur) return;
    try {
      $('shot').src = makePic(cur);
      $('mask').className = 'mask show';
    } catch (e) { toast('生成图片失败'); }
  };
  $('close').onclick = closeMask;
  $('mask').onclick = function (e) { if (e.target === $('mask')) closeMask(); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMask(); });

  // 首屏：支持 ?n=233 指定题目
  var qm = /[?&]n=(\d+)/.exec(location.search || '');
  var init = qm ? Math.min(Number(qm[1]), 1000000000) : 2025;
  if (init >= 1) { $('num').value = init; run(init, false); }
  else run(2025, false);
})();
</script>
</body>
